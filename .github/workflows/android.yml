name: Android

on:
  push:
    branches: [main]
    tags: ["v*-android.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Android and Bionic ARM64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        shell: pwsh
        run: |
          & sdkmanager.bat `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;$env:NDK_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Installing the Android SDK components failed."
          }

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed."
          }
          $errors = @()
          Get-ChildItem ./scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw "PowerShell syntax validation failed."
          }

      - name: Resolve maintained dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/setup-android-dependencies.ps1

      - name: Build release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/common/RuntimeProfiles.ps1
          foreach ($profile in Get-RuntimeProfileSelection -Name all) {
            $tag = "coreclr-$($profile.version)-$($profile.revision.Substring(0, 12))"
            $asset = "dotnet-runtime-$($profile.version)-$($profile.rid).zip"
            $download = Join-Path $env:RUNNER_TEMP $profile.rid
            gh release download $tag --repo LemonLoaderX/runtime `
              --pattern $asset --pattern "$asset.sha256" --dir $download
            if ($LASTEXITCODE -ne 0) { throw "Downloading $asset failed." }
            $archive = Join-Path $download $asset
            $expected = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
            if ($expected -notmatch '^[0-9a-f]{64}$' -or
                (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw "Runtime archive SHA-256 mismatch: $asset"
            }
            $pack = Join-Path $download 'pack'
            Expand-Archive -LiteralPath $archive -DestinationPath $pack
            Test-RuntimeProfilePack -Root $pack -Profile $profile
            ./scripts/build/build-android.ps1 -Configuration Release `
              -RuntimeProfile $profile.name -CoreClrRuntimePackRoot $pack `
              -AndroidNdkRoot "$env:ANDROID_SDK_ROOT\ndk\$env:NDK_VERSION"
          }

      - name: Record checksum
        id: artifact
        shell: pwsh
        run: |
          $lines = foreach ($archive in Get-ChildItem Output/Releases/*.zip | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($archive.Name)"
          }
          [IO.File]::WriteAllText(
            "Output/Releases/SHA256SUMS.txt",
            ($lines -join "`n") + "`n",
            [Text.Encoding]::ASCII)

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: LemonLoader-Android-arm64
          path: |
            Output/Releases/LemonLoader-Android-arm64.zip
            Output/Releases/LemonLoader-runtime-android-arm64.zip
            Output/Releases/LemonLoader-runtime-bionic-arm64.zip
            Output/Releases/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: LemonLoader-Android-arm64
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "LemonLoader $TAG" \
              --notes "Android ARM64 preview with selectable .NET 11 Android (default) and Bionic CoreCLR runtimes. Requires Patcher 1.1.0 or later and Android API 24+. Android synchronous HTTP remains unsupported by design. See the repository documentation for limitations."
          fi
