name: Android

on:
  push:
    branches: [main]
    tags: ["v*-android.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Android ARM64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        shell: pwsh
        run: |
          & sdkmanager.bat `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;$env:NDK_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Installing the Android SDK components failed."
          }

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed."
          }
          $errors = @()
          Get-ChildItem ./scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw "PowerShell syntax validation failed."
          }

      - name: Resolve maintained dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/setup-android-dependencies.ps1

      - name: Build release
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build/build-android.ps1 `
            -Configuration Release `
            -AndroidNdkRoot "$env:ANDROID_SDK_ROOT\ndk\$env:NDK_VERSION"

      - name: Record checksum
        id: artifact
        shell: pwsh
        run: |
          $archive = Resolve-Path "Output/Releases/LemonLoader-Android-arm64.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "Output/Releases/SHA256SUMS.txt",
            "$hash  LemonLoader-Android-arm64.zip`n",
            [Text.Encoding]::ASCII)
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: LemonLoader-Android-arm64
          path: |
            Output/Releases/LemonLoader-Android-arm64.zip
            Output/Releases/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: LemonLoader-Android-arm64
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "LemonLoader $TAG" \
              --notes "Android ARM64 preview using the .NET 10 CoreCLR backend. See the repository documentation for supported targets, installation, and known limitations."
          fi
